services:

type: web
name: upi-gateway
runtime: docker
plan: free
dockerfilePath: ./Dockerfile
envVars:

key: APP_NAME
value: ChemVault-UPI-Gateway

key: APP_ENV
value: production

key: APP_DEBUG
value: "false"

key: APP_KEY
generateValue: true

key: LOG_CHANNEL
value: stderr

key: DB_CONNECTION
value: mysql

key: DB_PORT
value: "4000"

key: DB_DATABASE
value: upi_gateway

key: DB_HOST
sync: false

key: DB_USERNAME
sync: false

key: DB_PASSWORD
sync: false

key: UPI_VPA
value: 7888690390@upi
